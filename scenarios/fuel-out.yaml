# A small load of lump holding 250 °F: fine for six hours, then the bed burns
# down, the fan goes to 100 % and the pit falls away.
name: fuel-out
description: "A small load of lump at 250 °F: it holds for six hours, then burns out."
duration: 10h
seed: 0
controller: proportional
ambient: 70
wind_mph: 0

cooker:
  fuel_btu: 100000

start: {pit_f: 250}

device:
  cook_set: 250
  cookhold: 180
