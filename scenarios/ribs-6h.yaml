# A rack of spare ribs at 250 °F: a short stall around 150 °F, then done at
# 195 °F in five to six hours.
name: ribs-6h
description: A rack of spare ribs at 250 °F from a cold start.
duration: 7h
seed: 0
controller: proportional
ambient: 70
wind_mph: 0

cooker:
  fuel_lb: 8

device:
  cook_set: 250
  food_set: {food1: 195}
  cookhold: 180

names: {cook: Pit, food1: Ribs}

food:
  # a big rack of spares: heavier than the preset, with the moisture to match
  food1: {cut: ribs, mass_lb: 8, moisture_btu: 750, temp_f: 40}
